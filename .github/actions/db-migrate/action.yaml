name: Flyway migrate
description: Mask the decoded database password, then show status, run Flyway migrate and show status again. Expects SUPABASE_DB_URL in the job env and the repository already checked out.

runs:
  using: composite
  steps:
    # make db-migrate* passes the URL-decoded password to Flyway, which GitHub's exact-match secret masking doesn't cover
    - name: Mask decoded database password
      shell: bash
      run: |
        python3 -c "import os; from urllib.parse import urlparse, unquote; print('::add-mask::' + unquote(urlparse(os.environ['SUPABASE_DB_URL']).password).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"

    - name: Show migration status (before)
      shell: bash
      run: make db-migrate-info

    - name: Run Flyway migrate
      shell: bash
      run: make db-migrate

    - name: Show migration status (after)
      shell: bash
      run: make db-migrate-info
