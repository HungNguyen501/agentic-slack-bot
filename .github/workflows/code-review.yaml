name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    # TODO: pin to the commit SHA of a tagged release once ci-workflows is pushed.
    uses: HungNguyen501/ci-workflows/.github/workflows/code-review.yaml@master
    with:
      exclude: "dist/**,**/*.lock"
      fail_on_severity: medium # fails on medium, high or critical; or: none | low | high | critical | low
    secrets:
      CI_OPEN_AI_KEY: ${{ secrets.CI_OPEN_AI_KEY }}
      GHCI_APP_ID: ${{ secrets.GHCI_APP_ID }}
      GHCI_APP_PRIVATE_KEY: ${{ secrets.GHCI_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      pull-requests: write
