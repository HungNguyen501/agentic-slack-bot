name: CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

    paths-ignore:
      - '*.md'
      - '.gitignore'
      - '.dockerignore'

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: "CI"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install deps
        run: |
          uv sync --all-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Lint Python
        run: make lint

      - name: Lint SQL
        run: make lint-sql
