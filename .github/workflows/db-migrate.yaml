name: DB Migrate

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            migrations:
              - 'src/migrations/**'

  migrate-dev:
    name: Flyway migrate (development)
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: development
    concurrency:
      group: db-migrate-development
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Flyway migrate
        uses: ./.github/actions/db-migrate

  migrate-staging:
    name: Flyway migrate (staging)
    needs: [changes, migrate-dev]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Flyway migrate
        uses: ./.github/actions/db-migrate
