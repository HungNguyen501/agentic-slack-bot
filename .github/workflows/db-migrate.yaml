name: DB Migrate

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            migrations:
              - 'src/migrations/**'

  migrate-dev:
    name: Flyway migrate (development)
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: db-migrate-development
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # make db-migrate* passes the URL-decoded password to Flyway, which GitHub's exact-match secret masking doesn't cover
      - name: Mask decoded database password
        run: |
          python3 -c "import os; from urllib.parse import urlparse, unquote; print('::add-mask::' + unquote(urlparse(os.environ['SUPABASE_DB_URL']).password))"

      - name: Show migration status (before)
        run: make db-migrate-info

      - name: Run Flyway migrate
        run: make db-migrate

      - name: Show migration status (after)
        run: make db-migrate-info

  migrate-staging:
    name: Flyway migrate (staging)
    needs: [changes, migrate-dev]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mask decoded database password
        run: |
          python3 -c "import os; from urllib.parse import urlparse, unquote; print('::add-mask::' + unquote(urlparse(os.environ['SUPABASE_DB_URL']).password))"

      - name: Show migration status (before)
        run: make db-migrate-info

      - name: Run Flyway migrate
        run: make db-migrate

      - name: Show migration status (after)
        run: make db-migrate-info
