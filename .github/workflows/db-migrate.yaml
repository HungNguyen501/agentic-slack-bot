name: DB Migrate

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  changes:
    name: Detect migration and skill changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      skills: ${{ steps.filter.outputs.skills }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            migrations:
              - 'src/migrations/**'
            skills:
              - 'src/agent/skills/files/**'

  migrate-dev:
    name: Flyway migrate (development)
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: development
    concurrency:
      group: db-migrate-development
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Flyway migrate
        uses: ./.github/actions/db-migrate

      # After the migrations, so the table exists. Runs whenever the job does (a migration or a skill changed): the sync is
      # idempotent, and the push that creates agent_skills touches no skill file but must still fill it.
      - name: Sync agent skills
        uses: ./.github/actions/skills-sync

  migrate-staging:
    name: Flyway migrate (staging)
    needs: [changes, migrate-dev]
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: staging
    concurrency:
      group: db-migrate-staging
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Flyway migrate
        uses: ./.github/actions/db-migrate

      # After the migrations, so the table exists. Runs whenever the job does (a migration or a skill changed): the sync is
      # idempotent, and the push that creates agent_skills touches no skill file but must still fill it.
      - name: Sync agent skills
        uses: ./.github/actions/skills-sync
