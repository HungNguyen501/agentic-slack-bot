name: Image Deploy

on:
  push:
    tags:
      - 'agentic-slack-bot-v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]'

permissions:
  contents: read

jobs:
  build-push:
    name: "Build and push image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not on master. Refusing to build/push." >&2
            exit 1
          fi

      - name: Derive image tag
        id: image-tag
        run: |
          git_tag="${GITHUB_REF_NAME}"
          echo "tag=${git_tag#agentic-slack-bot-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: make docker-build-push TAG=${{ steps.image-tag.outputs.tag }}
