name: Create Tag

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Tag type: agentic-slack-bot (build + push image)'
        type: choice
        options:
          - agentic-slack-bot
        default: agentic-slack-bot

permissions:
  contents: write

jobs:
  create-tag:
    name: "Create and push ${{ inputs.type }} tag"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Enforce master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "This workflow must be run from the master branch (got ${GITHUB_REF})." >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          TAG_TYPE: ${{ inputs.type }}
        run: |
          tag="${TAG_TYPE}-v$(date +%Y.%m.%d).$(git rev-parse --short=6 HEAD)"
          git tag "$tag"
          git push origin "$tag"
          echo "Created tag: $tag"
